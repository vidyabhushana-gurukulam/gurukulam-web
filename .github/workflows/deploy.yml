# .github/workflows/deploy.yml
# Builds the frontend and publishes it to GitHub Pages.
# Deploys from main so dev stays a working branch; merge dev into main to release.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: read the repo, write the Pages site, and mint the OIDC
# token it uses to authenticate the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are cancelled so the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

# Launch is paused: publish the static maintenance/ page instead of the real site.
# Set to "false" to build and deploy frontend/ again.
env:
  MAINTENANCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.MAINTENANCE != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: env.MAINTENANCE != 'true'

      - run: npm run lint
        if: env.MAINTENANCE != 'true'

      # Also emits one index.html per route, plus 404.html, sitemap.xml and robots.txt.
      - run: npm run build
        if: env.MAINTENANCE != 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MAINTENANCE == 'true' && 'maintenance' || 'frontend/dist' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
