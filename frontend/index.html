<!--
  index.html
  Supplies the React entry point and verified public metadata for the Vidyabhushana Gurukulam website.
  The title, description, og:title, og:description, og:url and canonical below are the homepage's
  values and the template for every other route: scripts/prerender-routes.mjs rewrites them per page
  after the build. Keep those tags on one line each so the script's replacements keep matching.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b3057" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Playfair+Display:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

    <meta name="description" content="Vidyabhushana Gurukulam is an English-medium GSEB day school in Vadodara combining NCERT academics with Vedic and cultural education. Admissions open for 2027-28, Nursery to Class 5." />
    <link rel="canonical" href="https://vidyabhushanagurukulam.com/" />
    <title>Vidyabhushana Gurukulam | Day School in Vadodara</title>

    <!-- Parents share admission links on WhatsApp, which reads these to build its preview card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vidyabhushana Gurukulam" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Vidyabhushana Gurukulam | Day School in Vadodara" />
    <meta property="og:description" content="Vidyabhushana Gurukulam is an English-medium GSEB day school in Vadodara combining NCERT academics with Vedic and cultural education. Admissions open for 2027-28, Nursery to Class 5." />
    <meta property="og:url" content="https://vidyabhushanagurukulam.com/" />
    <meta property="og:image" content="https://vidyabhushanagurukulam.com/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="Vidyabhushana Gurukulam. Admissions open for 2027-28, from Nursery to Class 5. Gotri Road, Vadodara." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
